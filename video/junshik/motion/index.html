<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counter — 9:16 draft v2 (junshik)</title>
<!--
  황준식 안 — 모션 그래픽 v2 (9:16, 1080×1920, 약 63초, 음향 포함).
  원칙(11:30 싱크·video/README.md): 깔끔하게, 글자 최소, 그림·모션으로. 한 컷에 시선 하나. 속도 비교 없음.
  열기: 브라우저로 연다 → Space 재생(소리 남), ←/→ 2초, H 조작 막대 숨김, R 처음부터. ?t=20 = 20초부터. ?rec = 녹화용.
  소리: assets/ — BGM = 팀 ElevenLabs 생성(조순형 build/assets), 효과음 = CC0 kit(같은 곳). 렌더 때는 CUES 로 따로 믹스.
  에이전트 이미지: ../../common/agents/ (회사 상표 — 돕는 구도로만).
-->
<style>
:root{--bg:#F6F4EF;--ink:#0F1B2A;--muted:#8A94A3;--blue:#1D78C6;--blue-50:#EAF3FC;--ok:#12A15F;--bad:#E04B4B;--yellow:#FFD84A;--card:#fff;--line:#E6E2D9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .3s}
.scene.active{opacity:1;visibility:visible}
.f{opacity:0;transition:opacity .45s,transform .6s cubic-bezier(.2,.9,.25,1.15)}
.f.on{opacity:1}
.up{transform:translateY(60px)}.up.on{transform:none}
.pop{transform:scale(.4)}.pop.on{transform:scale(1)}
.dark{background:#070a12;color:#fff}

/* caption — one short line, no box */
#cap{position:absolute;left:60px;right:60px;bottom:230px;text-align:center;font-size:72px;font-weight:800;line-height:1.15;letter-spacing:-.02em;z-index:50;pointer-events:none;transition:opacity .3s,transform .4s}
#cap.hide{opacity:0;transform:translateY(20px)}
#cap.light{color:#fff}

/* avatars */
.av{width:var(--s,120px);height:var(--s,120px);border-radius:50%;background-size:cover;background-position:center;box-shadow:0 10px 30px rgba(0,0,0,.18);border:4px solid #fff;flex:none}
.a-muse{background-image:url(../../common/agents/muse.png)}
.a-pickle{background-image:url(../../common/agents/pickle.png)}
.a-dots{background-image:url(../../common/agents/dots.png);background-color:#fff;background-size:80%;background-repeat:no-repeat}
.a-grok{background-image:url(../../common/agents/grok-bot.png)}
.mascot{border-radius:50%;background:#fff url(../../../app/public/counter.png) center/cover;box-shadow:0 20px 60px rgba(29,120,198,.35);border:8px solid #fff}
.owner{background:url(assets/owner.png) center/cover;border-radius:50%}

/* S1 crawl */
#swarm{position:absolute;inset:-80px}
#swarm .av{position:absolute;opacity:.35;border-width:2px}
#s1:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(7,10,18,.8) 0%,rgba(7,10,18,.25) 70%);z-index:1}
.crawl-wrap{position:absolute;inset:0;perspective:520px;display:flex;justify-content:center;z-index:2}
.crawl{position:absolute;bottom:-25%;width:1000px;text-align:center;color:var(--yellow);font-weight:900;font-size:136px;line-height:1.05;transform-origin:50% 100%;transform:rotateX(28deg)}
#s1.active .crawl{animation:crawl 2.6s cubic-bezier(.3,.1,.5,1) forwards}
#s1.active #swarm{animation:drift 2.6s linear forwards}
@keyframes crawl{0%{transform:rotateX(28deg) translateY(30%)}75%{opacity:1}100%{transform:rotateX(28deg) translateY(-250%);opacity:0}}
@keyframes drift{from{transform:scale(1.2)}to{transform:scale(1)}}

/* S2 earth */
.zw{position:absolute;inset:0;transform-origin:540px 1150px;transition:transform 1.2s cubic-bezier(.6,0,.4,1),opacity .35s .85s}
.zw.on{transform:scale(8);opacity:0}
.earth{position:absolute;left:50%;top:860px;width:1600px;height:1600px;margin-left:-800px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#3d8fe0,#1a4f99 45%,#0b2450 75%);box-shadow:0 0 140px rgba(80,160,255,.45)}
.land{position:absolute;border-radius:45%;background:#2f9e6a;opacity:.85}
.person{position:absolute;width:28px;height:28px;border-radius:50%;background:#ffe6c7}
.rain{position:absolute;transition:transform 1s cubic-bezier(.3,1.4,.5,1),opacity .2s;opacity:0}
.rain.on{opacity:1}
.bignum{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:120px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bignum small{display:block;font-size:56px;font-weight:700;margin-top:10px;opacity:.85}
.pulse{position:absolute;left:520px;top:1130px;width:40px;height:40px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 rgba(224,75,75,.6);animation:pulse 1s infinite}
@keyframes pulse{to{box-shadow:0 0 0 40px rgba(224,75,75,0)}}

/* S2b town */
.town{position:absolute;left:60px;top:210px;width:960px;height:1380px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:26px;transition:transform .8s cubic-bezier(.6,0,.4,1),opacity .3s .5s}
.town.on{transform:scale(4.2);opacity:0}
#s2b.active .town{animation:zin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes zin{from{transform:scale(1.6);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
.tile{position:relative;background:var(--card);border-radius:32px;display:grid;place-items:center;box-shadow:0 8px 24px rgba(15,27,42,.06);transition:box-shadow .15s,background .15s}
.tile .em{font-size:130px;line-height:1}
.tile.ring{background:#fff2f1;box-shadow:0 0 0 6px var(--bad)}
.tile.ring .em{animation:shake .1s infinite alternate}
@keyframes shake{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.tile .mc{position:absolute;right:18px;top:18px;min-width:52px;height:52px;border-radius:26px;background:var(--bad);color:#fff;font-size:28px;font-weight:900;display:grid;place-items:center;padding:0 12px;font-variant-numeric:tabular-nums;opacity:0}
.tile .mc.on{opacity:1}
.tile .caller{position:absolute;left:18px;top:18px;--s:72px;opacity:0;transform:scale(.5);transition:all .15s}
.tile .caller.on{opacity:1;transform:scale(1)}
.tile .rx{position:absolute;left:50%;bottom:16px;margin-left:-36px;font-size:64px;opacity:0;transform:translateY(10px);transition:all .15s}
.tile .rx.on{opacity:1;transform:none}

/* S3 clinic closeup */
#s3.active .cw0{animation:zin .7s cubic-bezier(.2,.8,.2,1)}
.cw0{position:absolute;inset:0}
.desk{position:absolute;left:60px;right:60px;top:1060px;height:120px;background:#fff;border-radius:28px;box-shadow:0 10px 0 #E6E2D9}
.own3{position:absolute;left:290px;top:520px;width:500px;height:500px}
#s3 .own3.stress{animation:shake .09s infinite alternate}
.sweat{position:absolute;left:720px;top:520px;font-size:110px;opacity:0;transition:opacity .2s}.sweat.on{opacity:1}
.dphone{position:absolute;left:150px;top:900px;font-size:170px}
#s3.active .dphone.ring{animation:shake .08s infinite alternate}
.miss{position:absolute;left:300px;top:900px;min-width:90px;height:90px;border-radius:45px;background:var(--bad);color:#fff;font-size:50px;font-weight:900;display:grid;place-items:center;padding:0 20px;font-variant-numeric:tabular-nums}
.orb{position:absolute;--s:130px;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .2s;opacity:0}
.orb.on{opacity:1}
.orb:after{content:"📞";position:absolute;right:-18px;top:-18px;font-size:54px}
.queue{position:absolute;left:0;right:0;top:1230px;text-align:center;font-size:120px;letter-spacing:20px}
.n848{position:absolute;left:0;right:0;top:1370px;text-align:center;font-size:200px;font-weight:900;color:var(--bad);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.src{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:22px;color:var(--muted)}

/* S4 counter steps in */
.bigph{position:absolute;left:50%;top:300px;margin-left:-160px;font-size:320px;transition:all .6s}
.xm{position:absolute;left:50%;top:320px;width:360px;height:360px;margin-left:-180px}
.xm:before,.xm:after{content:"";position:absolute;left:50%;top:50%;width:440px;height:30px;margin:-15px 0 0 -220px;background:var(--bad);border-radius:15px;transform:rotate(45deg) scaleX(0);transition:transform .3s}
.xm:after{transform:rotate(-45deg) scaleX(0);transition-delay:.12s}
.xm.on:before{transform:rotate(45deg) scaleX(1)}.xm.on:after{transform:rotate(-45deg) scaleX(1)}
.ph-out{transition:opacity .4s,transform .5s}.ph-out.on{opacity:0;transform:translateY(-200px) scale(.5)}
.own4{position:absolute;left:50%;top:860px;width:300px;height:300px;margin-left:-150px;opacity:.9}
.shield{position:absolute;left:50%;top:560px;width:460px;height:460px;margin-left:-230px;transform:translateY(-1400px);transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.shield.on{transform:none}
.shield .mascot{width:100%;height:100%}
.glow{position:absolute;left:50%;top:520px;width:540px;height:540px;margin-left:-270px;border-radius:50%;box-shadow:0 0 0 0 rgba(29,120,198,.0);transition:box-shadow .6s}
.glow.on{box-shadow:0 0 0 30px rgba(29,120,198,.12),0 0 0 70px rgba(29,120,198,.06)}
.inc{position:absolute;--s:120px;opacity:0}
.inc.on{opacity:1}
.ok{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:42px;font-weight:900;display:grid;place-items:center;opacity:0;transform:scale(.3);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.ok.on{opacity:1;transform:scale(1)}

/* demo cuts */
.col{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center}
.bub{background:#fff;border-radius:40px;padding:26px 36px;font-size:96px;box-shadow:0 14px 40px rgba(15,27,42,.1);position:relative;line-height:1}
.bub:after{content:"";position:absolute;left:50%;bottom:-22px;margin-left:-22px;border:22px solid transparent;border-bottom:0;border-top-color:#fff}
.arrow{width:10px;height:120px;background:repeating-linear-gradient(var(--blue) 0 18px,transparent 18px 32px);border-radius:5px;transform-origin:top;transform:scaleY(0);transition:transform .45s}
.arrow.on{transform:scaleY(1)}
.emma{font-size:220px;line-height:1}
.hub{position:absolute;left:50%;top:640px;width:380px;height:380px;margin-left:-190px}
.hub .mascot{width:100%;height:100%}
.sat{position:absolute;--s:150px}
.q{position:absolute;font-size:70px;background:#fff;border-radius:28px;padding:10px 16px;box-shadow:0 8px 24px rgba(15,27,42,.12);opacity:0;transition:transform .55s cubic-bezier(.5,0,.5,1),opacity .2s}
.q.on{opacity:1}
.tally{position:absolute;left:0;right:0;top:250px;display:flex;justify-content:center;gap:60px;font-size:110px;font-weight:900;font-variant-numeric:tabular-nums}
.tally .g{color:var(--ok)}.tally .b{color:var(--blue)}
.ownmini{position:absolute;left:50%;top:1200px;width:260px;height:260px;margin-left:-130px}
.zz{position:absolute;left:620px;top:1190px;font-size:90px}
.qmark{position:absolute;left:50%;top:600px;margin-left:120px;width:120px;height:120px;border-radius:50%;background:#F59E0B;color:#fff;font-size:84px;font-weight:900;display:grid;place-items:center;opacity:0;transform:scale(.3);transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.qmark.on{opacity:1;transform:scale(1)}
.brain{position:absolute;font-size:100px;opacity:0;transition:transform .8s cubic-bezier(.5,0,.3,1),opacity .2s}
.brain.on{opacity:1}
.phone{position:absolute;left:50%;top:330px;width:560px;height:1060px;margin-left:-280px;background:#0F1B2A;border-radius:76px;padding:22px;box-shadow:0 40px 100px rgba(15,27,42,.3)}
.phone .ps{width:100%;height:100%;background:#F4F6F9;border-radius:56px;overflow:hidden;position:relative;padding:120px 34px 0}
.pc{background:#fff;border-radius:36px;padding:40px 32px;text-align:center;box-shadow:0 10px 30px rgba(15,27,42,.08);border:4px solid var(--blue);opacity:0;transform:translateY(40px);transition:all .4s}
.pc.on{opacity:1;transform:none}
.pc .big{font-size:150px;line-height:1.1}
.pc .row{display:flex;gap:20px;justify-content:center;margin-top:30px}
.btn{width:150px;height:110px;border-radius:30px;display:grid;place-items:center;font-size:64px;font-weight:900;transition:transform .12s,background .2s}
.btn.y{background:var(--ok);color:#fff}.btn.n{background:#EEF1F5;color:var(--muted)}
.btn.tap{transform:scale(.85);background:#0b7a45}
.finger{position:absolute;font-size:120px;opacity:0;transition:opacity .2s,transform .3s;z-index:5}
.finger.on{opacity:1}
.toggle{display:inline-flex;align-items:center;gap:14px;margin-top:26px;font-size:60px}
.toggle .sw{width:110px;height:62px;border-radius:31px;background:#DDE3EA;position:relative;transition:background .25s}
.toggle .sw:after{content:"";position:absolute;left:6px;top:6px;width:50px;height:50px;border-radius:50%;background:#fff;transition:left .25s}
.toggle .sw.on{background:var(--ok)}.toggle .sw.on:after{left:54px}
.stream{position:absolute;width:44px;height:44px;border-radius:50%;opacity:0}
.flowline{position:absolute;left:50%;width:8px;margin-left:-4px;background:repeating-linear-gradient(var(--blue) 0 14px,transparent 14px 26px);transform-origin:top;transform:scaleY(0);transition:transform .4s}
.flowline.on{transform:scaleY(1)}
.calm{position:absolute;left:50%;top:420px;width:620px;height:620px;margin-left:-310px}
.cust{position:absolute;left:640px;top:820px;font-size:200px}
.silent{position:absolute;left:180px;top:930px;font-size:150px;opacity:.5}
.silent:after{content:"💤";position:absolute;right:-60px;top:-50px;font-size:80px}

/* global 1x4 */
.rows{position:absolute;left:0;right:0;top:0;bottom:440px;display:grid;grid-template-rows:repeat(4,1fr)}
.rowg{position:relative;display:flex;align-items:center;justify-content:center;gap:50px;opacity:0;transform:translateX(120px);transition:all .45s cubic-bezier(.2,.9,.25,1.1)}
.rowg.on{opacity:1;transform:none}
.rowg:nth-child(1){background:#FBE3DF}.rowg:nth-child(2){background:#E2F2E0}.rowg:nth-child(3){background:#E0EAF9}.rowg:nth-child(4){background:#F7EAD6}
.rowg .fl{font-size:120px}.rowg .fc{font-size:170px}.rowg .av{--s:130px}
.rowg .ck{width:110px;height:110px;border-radius:50%;background:var(--ok);color:#fff;font-size:70px;font-weight:900;display:grid;place-items:center}

/* logo */
#s12{background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
#s12 .mascot{width:340px;height:340px}
#s12 h1{font-size:170px;font-weight:900;letter-spacing:-.03em}
#s12 p{font-size:60px;font-weight:600;text-align:center;line-height:1.2;padding:0 80px}

/* controls */
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:10px 16px;background:rgba(10,14,22,.92);color:#cfd6e0;font:14px -apple-system,sans-serif;z-index:100}
#ctl button{background:#1D78C6;color:#fff;border:0;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
#ctl input[type=range]{flex:1}
#ctl .t{font-variant-numeric:tabular-nums;min-width:96px}
#ctl .hint{opacity:.6}
body.rec #ctl,body.hidectl #ctl{display:none}
</style>
</head>
<body>
<div id="stage">

  <!-- S1 0–2.2: the invasion -->
  <section class="scene dark" id="s1" data-s="0" data-e="2.2">
    <div id="swarm"></div>
    <div class="crawl-wrap"><div class="crawl">The Agent<br>Invasion<br>Has Begun.</div></div>
  </section>

  <!-- S2 2–5.2: a billion agents land -->
  <section class="scene dark" id="s2" data-s="2" data-e="5.3">
    <div class="zw" data-at="2.3">
      <div class="bignum f up" data-at="0.1"><span id="billion">0</span><small>agents</small></div>
      <div class="earth" id="earth"></div>
      <div id="rainbox"></div>
      <div class="pulse f" data-at="1.8"></div>
    </div>
  </section>

  <!-- S2b 5.2–10: they call every shop -->
  <section class="scene" id="s2b" data-s="5.2" data-e="10">
    <div class="town" id="town" data-at="4.3"></div>
  </section>

  <!-- S3 10–15: one clinic, drowning -->
  <section class="scene" id="s3" data-s="10" data-e="15">
    <div class="cw0">
      <div class="desk"></div>
      <div class="own3 owner" id="own3"></div>
      <div class="sweat" id="sweat">💦</div>
      <div class="dphone ring" id="dphone">☎️</div>
      <div class="miss" id="miss">0</div>
      <div id="orbs"></div>
      <div class="queue f up" data-at="1.4" id="queue">😤🧓😠👩</div>
      <div class="n848 f pop" data-at="2.6"><span id="n848">0</span></div>
      <div class="src f" data-at="2.8">Source: The San Francisco Standard, Oct 29, 2026</div>
    </div>
  </section>

  <!-- S4 15–20: Counter steps in front of the owner -->
  <section class="scene" id="s4" data-s="15" data-e="20">
    <div class="ph-out" data-at="1.0"><div class="bigph">☎️</div><div class="xm" data-at="0.3"></div></div>
    <div class="glow" data-at="1.8"></div>
    <div class="own4 owner f" data-at="1.2"></div>
    <div class="shield" data-at="1.4"><div class="mascot"></div></div>
    <div id="incbox"></div>
  </section>

  <!-- S5 20–24.5: Emma → Muse → Counter -->
  <section class="scene" id="s5" data-s="20" data-e="24.5">
    <div class="col" style="top:200px;gap:26px">
      <div class="bub f pop" data-at="0.4">🏥 ♿ 📅</div>
      <div class="emma f up" data-at="0.1">👩‍🦽</div>
      <div class="arrow" data-at="1.2"></div>
      <div class="av a-muse f pop" data-at="1.6" style="--s:220px"></div>
      <div class="arrow" data-at="2.3"></div>
      <div class="mascot f pop" data-at="2.7" style="width:260px;height:260px"></div>
    </div>
  </section>

  <!-- S6 24.5–30: Counter answers everything -->
  <section class="scene" id="s6" data-s="24.5" data-e="30">
    <div class="tally f" data-at="0.2"><span class="g">✓ <span id="nok">0</span></span></div>
    <div class="hub f pop" data-at="0"><div class="mascot"></div></div>
    <div id="satbox"></div>
    <div class="ownmini owner f" data-at="2.6"></div>
    <div class="zz f" data-at="3.0">🔕</div>
  </section>

  <!-- S7 30–36: a new question goes to the owner once -->
  <section class="scene" id="s7" data-s="30" data-e="36">
    <div class="phone f up" data-at="0"><div class="ps">
      <div class="pc on" style="opacity:1;transform:none">
        <div style="display:flex;justify-content:center;gap:20px;align-items:center"><div class="av a-muse" style="--s:110px"></div><div class="big">👩‍⚕️❓</div></div>
        <div class="row"><div class="btn y" id="yes7">✓</div><div class="btn n">✕</div></div>
        <div class="toggle">🧠 <span class="sw" id="sw7"></span></div>
      </div>
    </div></div>
    <div class="finger" id="f7">👆</div>
    <div class="brain" id="brain7">🧠</div>
  </section>

  <!-- S8 36–40: next agent, answered from memory -->
  <section class="scene" id="s8" data-s="36" data-e="40">
    <div class="hub f pop" data-at="0" style="top:760px"><div class="mascot"></div></div>
    <div class="f" data-at="0" style="position:absolute;left:560px;top:690px;font-size:120px">🧠</div>
    <div class="av a-pickle f pop" data-at="0.4" style="position:absolute;left:390px;top:220px;--s:300px"></div>
    <div class="bub f pop" data-at="0.9" style="position:absolute;left:680px;top:240px;font-size:84px">👩‍⚕️❓</div>
    <div class="ok" data-at="1.7" style="left:470px;top:560px;width:140px;height:140px;font-size:90px">✓</div>
  </section>

  <!-- S9 40–46: most end at Counter, one goes to the owner -->
  <section class="scene" id="s9" data-s="40" data-e="46">
    <div class="tally f" data-at="0.1" style="top:160px"><span class="g">✓ <span id="nok9">0</span></span><span class="b">👆 <span id="nme9">0</span></span></div>
    <div class="hub f pop" data-at="0" style="top:520px;width:320px;height:320px;margin-left:-160px"><div class="mascot"></div></div>
    <div id="streambox"></div>
    <div class="flowline" data-at="2.2" style="top:860px;height:190px"></div>

[['🇬🇧', 'muse', '😄'], ['🇨🇳', 'pickle', '😆'], ['🇻🇳', 'dots', '🥳'], ['🇯🇵', 'grok', '😊']].forEach((r, i) => {

// ---------- timeline ----------

const cap = $('#cap');
let t = 0, playing = false, last = 0, prevT = 0;

function render() {
  for (const sc of scenes) {
    const act = t >= sc.s && t < sc.e, lt = t - sc.s;
    sc.el.classList.toggle('active', act);
