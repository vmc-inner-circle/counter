<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="brand/gsap.min.js"></script>
<script src="brand/rs-motion.js"></script>
<style>
@font-face { font-family: "Apple Color Emoji"; src: local("Apple Color Emoji"); }
@font-face { font-family: "Pretendard"; src: url("brand/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ededef; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ededef; color: #111;
  font-family: "Pretendard", "Apple Color Emoji", sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
.abs { position: absolute; }
video, .card img, .pc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* 1 훅 */
#hook { left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 540px 860px; z-index: 20; background: #000; }
#hook-shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%); }
#hook-cap { position: absolute; left: 64px; right: 64px; top: 1290px; color: #fff; }
.sw { position: absolute; left: 518px; top: 838px; width: 44px; height: 44px; border-radius: 50%; z-index: 21; opacity: 0;
  box-shadow: 0 6px 16px rgba(0,0,0,.18); border: 3px solid #fff; }

/* 글리치로 나오는 줄 */
.row { position: relative; display: block; width: max-content; max-width: 100%; transform: skewX(-9deg); transform-origin: 0 100%; }
.row .txt { position: relative; display: block; white-space: nowrap; }
.row .flash { position: absolute; top: 0; bottom: 0; left: 0; width: 120px; opacity: 0; background: #fff; }
.big { font-size: 116px; font-weight: 900; letter-spacing: -.035em; line-height: 1.08; text-shadow: 0 6px 30px rgba(0,0,0,.4); }

/* 2 채팅 */
#chat { left: 56px; right: 56px; bottom: 420px; display: flex; flex-direction: column; align-items: stretch; }
.msg { position: relative; overflow: visible; height: 0; }
.msg .in { position: absolute; left: 0; right: 0; bottom: 0; padding-top: 20px; display: flex; flex-direction: column; }
.msg.me .in { align-items: flex-end; }
.bub { max-width: 820px; font-size: 46px; font-weight: 500; line-height: 1.32; padding: 24px 34px 26px; border-radius: 44px; white-space: pre-line; }
.me .bub { background: #0a84ff; color: #fff; border-bottom-right-radius: 14px; transform-origin: 100% 100%; }
.you .bub { background: #fff; color: #111; border-bottom-left-radius: 14px; box-shadow: 0 6px 22px rgba(0,0,0,.06); transform-origin: 0 100%; }
.bub a { color: #0a84ff; text-decoration: underline; }
.name { font-size: 28px; font-weight: 500; color: #8e8e93; margin: 0 0 6px 30px; }
.pic { width: 470px; height: 620px; border-radius: 32px; overflow: hidden; position: relative; transform-origin: 0 100%; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.pic img { width: 100%; height: 100%; object-fit: cover; }

/* 3 캐러셀 */
#car { left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; transform-origin: 540px 830px; }
.card { position: absolute; top: 300px; left: 0; width: 600px; height: 1048px; border-radius: 34px; overflow: hidden; background: #d9d9dc;
  transform-origin: 300px 524px; box-shadow: 0 14px 40px rgba(0,0,0,.12); }
#chip { left: 0; right: 0; top: 1380px; display: flex; justify-content: center; }
#chip span { font-size: 32px; font-weight: 600; color: #fff; background: #111; border-radius: 999px; padding: 12px 26px; letter-spacing: .01em; }
.note { display: flex; align-items: center; gap: 16px; background: rgba(255,255,255,.92); border-radius: 999px; padding: 14px 30px 14px 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.10); font-size: 32px; font-weight: 600; white-space: nowrap; opacity: 0; backdrop-filter: blur(10px); }
.note i { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-style: normal; font-size: 28px; font-weight: 800; }
#views { left: 272px; top: 1262px; display: flex; align-items: center; gap: 12px; color: #fff; font-size: 40px; font-weight: 700;
  font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,.45); }
#views svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
#views-note { left: 0; right: 0; top: 1446px; text-align: center; font-size: 24px; font-weight: 500; color: #8e8e93; }
#pills { right: 56px; top: 1500px; display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.pill { font-size: 40px; font-weight: 800; color: #fff; border-radius: 999px; padding: 14px 32px; opacity: 0; white-space: nowrap; }

/* 4 원본 → 결과 */
#cmp { left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 560px; }
#cmp-head { left: 64px; right: 64px; top: 380px; font-size: 60px; font-weight: 800; letter-spacing: -.03em; opacity: 0; }
.pc { position: absolute; top: 560px; width: 470px; height: 822px; border-radius: 30px; overflow: hidden; background: #d9d9dc; box-shadow: 0 14px 40px rgba(0,0,0,.14); opacity: 0; }
#pc-in { left: 50px; } #pc-out { left: 560px; }
#pc-out img { opacity: 0; } #pc-out img#po0 { opacity: 1; }
.badge { position: absolute; right: 18px; top: 18px; font-size: 24px; font-weight: 700; letter-spacing: .04em; color: #fff; background: rgba(0,0,0,.45);
  border-radius: 10px; padding: 6px 12px; backdrop-filter: blur(6px); z-index: 2; }

/* 5 타이틀 */
#t-logo { left: 64px; top: 214px; height: 44px; opacity: 0; }
#t-title { left: 64px; top: 268px; }
#t-title .txt { font-size: 150px; font-weight: 900; letter-spacing: -.045em; line-height: 1.04; }
#t-pills { left: 64px; top: 470px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
#t-pills .pill { font-size: 42px; }

/* 6 끝 */
#end { inset: 0; background: #fff; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; z-index: 30; }
#end img { height: 70px; }
#end-line { font-size: 38px; font-weight: 600; color: #222; }
#end-url { font-size: 30px; font-weight: 500; color: #888; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="stage" data-composition-id="rs-chat-carousel" data-start="0" data-duration="28" data-width="1080" data-height="1920"
  data-composition-variables='[{"id":"headline1","type":"string","label":"훅 카피 1줄","default":"촬영은 한 번."},{"id":"headline2","type":"string","label":"훅 카피 2줄","default":"컬러는 무한대."},{"id":"chat_me","type":"string","label":"채팅 — 내 말풍선(\\n 줄바꿈)","default":"파카 한 벌 찍었는데\\n컬러별 화보가 다 나왔어 😳"},{"id":"chat_name","type":"string","label":"채팅 — 상대 이름","default":"지연"},{"id":"chat_reply","type":"string","label":"채팅 — 상대 답 1","default":"재촬영 없이?? 😮"},{"id":"chat_ask","type":"string","label":"채팅 — 상대 답 2","default":"우리 브랜드 옷도 해줘 🙏"},{"id":"chat_link","type":"string","label":"채팅 — 링크 글자","default":"realsnap.ai"},{"id":"names","type":"string","label":"결과 7개 이름(· 로 구분)","default":"레몬 옐로·레드·민트·라벤더·네이비·크림·블랙"},{"id":"notes","type":"string","label":"캐러셀 말풍선 4개(| 로 구분)","default":"같은 모델 · 같은 구도|색만 바꿔서 다시 생성|재촬영 0번|7가지 컬러를 한 번에"},{"id":"counter","type":"string","label":"카드 숫자 아이콘: likes(♡) · views(▶) · none","default":"likes"},{"id":"counts","type":"string","label":"카드별 숫자(· 로 구분, 카드 순서대로)","default":"1,248·2,031·2,877·3,402·4,116·4,893·5,620"},{"id":"views_note","type":"string","label":"숫자 아래 작은 글씨(비우면 숨김)","default":""},{"id":"pill1","type":"string","label":"캐러셀 알약 1","default":"촬영 1번"},{"id":"pill2","type":"string","label":"캐러셀 알약 2","default":"컬러 8가지"},{"id":"cmp_head","type":"string","label":"원본→결과 제목","default":"같은 사진, 색만 바꿔서"},{"id":"tag_in","type":"string","label":"원본 카드 표시","default":"원본 컬러"},{"id":"tag_out","type":"string","label":"결과 카드 표시","default":"RealSnap 결과"},{"id":"title","type":"string","label":"타이틀","default":"컬러 스왑"},{"id":"ctas","type":"string","label":"타이틀 알약 3개(| 로 구분)","default":"옷 사진 한 장이면|컬러별 화보 완성|지금 무료로 시작"},{"id":"end_line","type":"string","label":"끝 장면 한 줄","default":"옷 사진 한 장이면, 컬러별 화보까지"},{"id":"end_url","type":"string","label":"끝 장면 주소","default":"realsnap.ai"},{"id":"accent","type":"color","label":"강조색","default":"#F2362F"}]'>

  <!-- 3 캐러셀(뒤) -->
  <div id="car" class="abs">
    <div id="cards">
      <div class="card" id="card0"><img src="assets/slots/out-1.jpg" alt="" /><video id="v-card0" class="clip" data-start="7.70" data-duration="1.70" data-media-start="0.5" data-track-index="1" src="assets/slots/out-1.mp4" muted playsinline></video></div>
      <div class="card" id="card1"><img src="assets/slots/out-2.jpg" alt="" /><video id="v-card1" class="clip" data-start="8.90" data-duration="1.80" data-media-start="0.5" data-track-index="2" src="assets/slots/out-2.mp4" muted playsinline></video></div>
      <div class="card" id="card2"><img src="assets/slots/out-3.jpg" alt="" /><video id="v-card2" class="clip" data-start="10.20" data-duration="1.80" data-media-start="0.5" data-track-index="1" src="assets/slots/out-3.mp4" muted playsinline></video></div>
      <div class="card" id="card3"><img src="assets/slots/out-4.jpg" alt="" /><video id="v-card3" class="clip" data-start="11.50" data-duration="1.80" data-media-start="0.5" data-track-index="2" src="assets/slots/out-4.mp4" muted playsinline></video></div>
      <div class="card" id="card4"><img src="assets/slots/out-5.jpg" alt="" /><video id="v-card4" class="clip" data-start="12.80" data-duration="1.80" data-media-start="0.5" data-track-index="1" src="assets/slots/out-5.mp4" muted playsinline></video></div>
      <div class="card" id="card5"><img src="assets/slots/out-6.jpg" alt="" /><video id="v-card5" class="clip" data-start="14.10" data-duration="1.80" data-media-start="0.5" data-track-index="2" src="assets/slots/out-6.mp4" muted playsinline></video></div>
      <div class="card" id="card6"><img src="assets/slots/out-7.jpg" alt="" /><video id="v-card6" class="clip" data-start="15.40" data-duration="1.80" data-media-start="0.5" data-track-index="1" src="assets/slots/out-7.mp4" muted playsinline></video></div>
    </div>
    <div id="chip" class="abs"><span id="chip-t"></span></div>
    <div id="views" class="abs"><svg id="ic-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="#fff"/></svg><svg id="ic-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.4 4.5 7 4.5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.6 0 5.6 3.5 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg><span id="views-n">0</span></div>
    <div id="views-note" class="abs"></div>
    <div id="notes"></div>
    <div id="pills" class="abs"><span class="pill" id="pill1"></span><span class="pill" id="pill2"></span></div>
  </div>

  <!-- 4·5 원본 → 결과, 타이틀 -->
  <div id="cmp" class="abs">
    <div id="cmp-head" class="abs"></div>
    <div class="pc" id="pc-in">
      <img src="assets/slots/input.jpg" alt="" />
      <video id="v-in-a" class="clip" data-start="17" data-duration="4" data-media-start="0.8" data-track-index="3" src="assets/slots/input.mp4" muted playsinline></video>
      <video id="v-in-b" class="clip" data-start="21" data-duration="5" data-media-start="0.1" data-track-index="4" src="assets/slots/input.mp4" muted playsinline></video>
      <span class="badge" id="tag-in"></span>
    </div>
    <div class="pc" id="pc-out"><img id="po0" src="assets/slots/out-1.jpg" alt="" /><img id="po1" src="assets/slots/out-2.jpg" alt="" /><img id="po2" src="assets/slots/out-3.jpg" alt="" /><img id="po3" src="assets/slots/out-4.jpg" alt="" /><img id="po4" src="assets/slots/out-5.jpg" alt="" /><img id="po5" src="assets/slots/out-6.jpg" alt="" /><img id="po6" src="assets/slots/out-7.jpg" alt="" /><span class="badge" id="tag-out"></span></div>
  </div>
  <img id="t-logo" class="abs" src="brand/realsnap-logo.png" alt="RealSnap" />
  <div id="t-title" class="abs"><span class="row"><span class="txt" id="t-title-t"></span><i class="flash"></i></span></div>
  <div id="t-pills" class="abs"></div>

  <!-- 2 채팅 -->
  <div id="chat" class="abs">
    <div class="msg me" id="m1"><div class="in"><div class="bub" id="m1-t"></div></div></div>
    <div class="msg you" id="m2"><div class="in"><div class="name" id="m2-n"></div><div class="bub" id="m2-t"></div></div></div>
    <div class="msg you" id="m3"><div class="in"><div class="bub" id="m3-t"></div></div></div>
    <div class="msg you" id="m4"><div class="in"><div class="pic"><img src="assets/slots/out-1.jpg" alt="" /></div></div></div>
  </div>

  <!-- 1 훅(맨 앞) -->
  <div id="hook" class="abs">
    <video id="v-hook" class="clip" data-start="0" data-duration="3.6" data-media-start="0" data-track-index="0" src="assets/slots/input.mp4" muted playsinline></video>
    <div id="hook-shade"></div>
    <div id="hook-cap">
      <span class="row big" id="h1"><span class="txt" id="h1-t"></span><i class="flash"></i></span>
      <span class="row big" id="h2"><span class="txt" id="h2-t"></span><i class="flash"></i></span>
    </div>
  </div>
  <div id="swatches"></div>

  <!-- 6 끝 -->
  <div id="end" class="abs"><img src="brand/realsnap-logo.png" alt="RealSnap" /><div id="end-line"></div><div id="end-url"></div></div>

  <audio id="a-bgm" class="clip" data-start="0" data-duration="28" data-track-index="10" src="assets/slots/bgm.mp3" data-volume="0.45"></audio>
  <audio id="a-w1" class="clip" data-start="2.3" data-duration="0.8" data-track-index="11" src="assets/sfx/whoosh.mp3" data-volume="0.5"></audio>
  <audio id="a-w2" class="clip" data-start="7.5" data-duration="0.8" data-track-index="12" src="assets/sfx/whoosh.mp3" data-volume="0.5"></audio>
  <audio id="a-w3" class="clip" data-start="16.9" data-duration="0.8" data-track-index="13" src="assets/sfx/whoosh.mp3" data-volume="0.5"></audio>
  <audio id="a-sh" class="clip" data-start="17.45" data-duration="0.8" data-track-index="14" src="assets/sfx/shutter.mp3" data-volume="0.45"></audio>
  <audio id="a-w4" class="clip" data-start="21" data-duration="0.8" data-track-index="15" src="assets/sfx/whoosh.mp3" data-volume="0.5"></audio>
</div>
<script>
(() => {
  const V = RS.vars({ headline1: "촬영은 한 번.", headline2: "컬러는 무한대.", chat_me: "파카 한 벌 찍었는데\\n컬러별 화보가 다 나왔어 😳",
    chat_name: "지연", chat_reply: "재촬영 없이?? 😮", chat_ask: "우리 브랜드 옷도 해줘 🙏", chat_link: "realsnap.ai",
    names: "레몬 옐로·레드·민트·라벤더·네이비·크림·블랙", notes: "같은 모델 · 같은 구도|색만 바꿔서 다시 생성|재촬영 0번|7가지 컬러를 한 번에",
    counter: "likes", counts: "1,248·2,031·2,877·3,402·4,116·4,893·5,620", views_note: "", pill1: "촬영 1번", pill2: "컬러 8가지", cmp_head: "같은 사진, 색만 바꿔서", tag_in: "원본 컬러", tag_out: "RealSnap 결과", title: "컬러 스왑",
    ctas: "옷 사진 한 장이면|컬러별 화보 완성|지금 무료로 시작", end_line: "옷 사진 한 장이면, 컬러별 화보까지", end_url: "realsnap.ai", accent: "#F2362F" });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const br = (s) => esc(String(s).split("\\n").join("\n"));
  const N = 7, DUR = 28, A = V.accent;
  const names = String(V.names).split("·").map((s) => s.trim());
  const notes = String(V.notes).split("|").map((s) => s.trim()).filter(Boolean).slice(0, 4);
  const ctas = String(V.ctas).split("|").map((s) => s.trim()).filter(Boolean).slice(0, 3);

  // ── 글·소재 채우기
  $("h1-t").textContent = V.headline1; $("h2-t").textContent = V.headline2;
  $("m1-t").innerHTML = br(V.chat_me); $("m2-n").textContent = V.chat_name; $("m2-t").innerHTML = br(V.chat_reply);
  $("m3-t").innerHTML = `${br(V.chat_ask)}<br><a>${esc(V.chat_link)}</a>`;
  // 카드 k 의 숫자 — 가운데 서면 0.6배에서 이 값까지 올라간다
  const COUNTS = String(V.counts).split("·").map((x) => Math.max(0, Math.round(Number(String(x).replace(/[^0-9.]/g, "")) || 0)));
  const COUNTER = ["likes", "views"].includes(V.counter) && COUNTS.some((x) => x > 0) ? V.counter : "none";
  $("views-note").textContent = COUNTER !== "none" ? V.views_note : "";
  $(COUNTER === "views" ? "ic-heart" : "ic-play").style.display = "none";
  if (COUNTER === "none") $("views").style.display = "none";
  $("pill1").textContent = V.pill1; $("pill2").textContent = V.pill2;
  $("pill1").style.background = A; $("pill2").style.background = "#111";
  $("cmp-head").textContent = V.cmp_head; $("tag-in").textContent = V.tag_in; $("tag-out").textContent = V.tag_out;
  $("t-title-t").textContent = V.title; $("end-line").textContent = V.end_line; $("end-url").textContent = V.end_url;

  // 캐러셀 카드 7장: 사진(늘 보임) + 가운데 올 때만 영상. Tk = k번째 카드가 가운데 서는 시각
  const T0 = 8.0, STEP = 1.3, HOLD = 0.9, CW = 600, PITCH = 648;
  const Tk = (k) => T0 + k * STEP;
  const NOTE_POS = [{ left: 40, top: 520 }, { right: 40, top: 860 }, { left: 40, top: 1090 }, { right: 40, top: 430 }];
  const NOTE_AT = [8.6, 9.8, 11.2, 12.6];
  $("notes").innerHTML = notes.map((n, i) => {
    const p = NOTE_POS[i], side = p.left != null ? `left:${p.left}px` : `right:${p.right}px`;
    return `<div class="note abs" id="note${i}" style="${side};top:${p.top}px"><i style="background:${i % 2 ? "#111" : A}">✓</i>${esc(n)}</div>`;
  }).join("");
  $("t-pills").innerHTML = ctas.map((c, i) => `<span class="pill" id="tp${i}" style="background:${i === ctas.length - 1 ? "#111" : A}">${esc(c)}</span>`).join("");
  const SW = ["#9cc9ea", "#f3d23c", "#d8312c", "#8fd6c3", "#b9a6de", "#2b3f6b", "#ece4d0", "#1c1c1c"];
  $("swatches").innerHTML = SW.map((c, i) => `<i class="sw" id="sw${i}" style="background:${c}"></i>`).join("");

  // ── 매 프레임 계산하는 것(seek 안전)
  const JIT = [14, -10, 7, -4, 0];
  const rowIn = (row, t, at, out) => {
    const p = RS.seg(t, at, at + 0.36, "power2.out"), q = out ? RS.seg(t, out, out + 0.25) : 0;
    const txt = row.querySelector(".txt"), fl = row.querySelector(".flash"), w = row.offsetWidth;
    row.style.clipPath = `inset(-30px ${((1 - p) * 100).toFixed(2)}% -30px -30px)`;
    row.style.opacity = t < at ? 0 : 1 - q;
    const f = Math.floor((t - at) / 0.04);
    txt.style.transform = `translateX(${t >= at && f < JIT.length ? JIT[f] : 0}px)`;
    fl.style.opacity = t >= at && p < 1 ? 0.9 * (1 - p) : 0;
    fl.style.transform = `translateX(${(p * w - 60).toFixed(1)}px)`;
  };
  // 캐러셀 가운데 위치 c(t): 카드마다 HOLD 만큼 서 있다가 다음 카드로 미끄러진다
  const center = (t) => {
    for (let k = 0; k < N - 1; k++) {
      const m = Tk(k) + HOLD;
      if (t < m) return k;
      if (t < Tk(k + 1)) return k + RS.seg(t, m, Tk(k + 1), "power3.inOut");
    }
    return N - 1;
  };
  const MSG = [["m1", 3.45], ["m2", 4.35], ["m3", 5.25], ["m4", 6.15]];

  const render = (t) => {
    // 2 채팅: 새 말풍선 자리가 열리며(높이) 위 말풍선을 밀어 올리고, 말풍선은 모서리에서 튀어나온다
    const chatOn = t >= 3.3 && t < 8.2;
    $("chat").style.display = chatOn ? "flex" : "none";
    if (chatOn) {
      for (const [id, at] of MSG) {
        const el = $(id), inner = el.firstElementChild, h = inner.offsetHeight;
        const p = RS.seg(t, at, at + 0.32, "power3.out");
        el.style.height = `${(h * p).toFixed(1)}px`;
        const pop = RS.seg(t, at, at + 0.42, "back.out(2)");
        inner.lastElementChild.style.transform = `scale(${(0.55 + 0.45 * pop).toFixed(4)})`;
        inner.style.opacity = RS.seg(t, at, at + 0.12);
      }
      const out = RS.seg(t, 7.45, 7.9, "power2.in");
      $("chat").style.opacity = 1 - out;
      $("chat").style.filter = `blur(${(out * 14).toFixed(1)}px)`;
      $("chat").style.transform = `scale(${(1 + out * 0.12).toFixed(4)})`;
    }

    // 3 캐러셀
    const carOn = t >= 7.6 && t < 17.4;
    $("car").style.display = carOn ? "block" : "none";
    if (carOn) {
      const c = center(t);
      for (let i = 0; i < N; i++) {
        const d = Math.min(Math.abs(i - c), 1.4), card = $(`card${i}`);
        const x = 540 - CW / 2 + (i - c) * PITCH;
        card.style.transform = `translateX(${x.toFixed(1)}px) scale(${(1 - 0.08 * Math.min(d, 1)).toFixed(4)})`;
        card.style.opacity = (1 - 0.5 * Math.min(d, 1)).toFixed(3);
        card.style.filter = d > 0.02 ? `blur(${(Math.min(d, 1) * 6).toFixed(1)}px)` : "none";
        card.style.display = Math.abs(i - c) < 2.2 ? "block" : "none";
      }
      const k = Math.round(c);
      if (COUNTER !== "none") {
        const end = COUNTS[k] ?? COUNTS[COUNTS.length - 1] ?? 0;
        const v = end * (0.6 + 0.4 * RS.seg(t, Tk(k) - 0.2, Tk(k) + 0.6, "power2.out"));
        $("views-n").textContent = Math.round(v).toLocaleString("en-US");
        const settle = 1 - Math.min(1, Math.abs(c - k) * 3), pulse = 1 + 0.18 * (1 - RS.seg(t, Tk(k), Tk(k) + 0.3, "power2.out"));
        $("views").style.opacity = settle.toFixed(3);
        $(COUNTER === "views" ? "ic-play" : "ic-heart").style.transform = `scale(${(t >= Tk(k) ? pulse : 1).toFixed(3)})`;
        $("views-note").style.opacity = RS.seg(t, 8.2, 8.6).toFixed(3);
      }
      $("chip-t").textContent = `${String(k + 2).padStart(2, "0")} · ${names[k] || ""}`;
      $("chip").style.opacity = 1 - Math.min(1, Math.abs(c - k) * 3);
      notes.forEach((_, i) => {
        const at = NOTE_AT[i], el = $(`note${i}`);
        const a = RS.seg(t, at, at + 0.4, "back.out(1.6)"), z = RS.seg(t, Math.min(at + 3.6, 16.6), Math.min(at + 3.6, 16.6) + 0.3);
        el.style.opacity = (RS.seg(t, at, at + 0.2) * (1 - z)).toFixed(3);
        el.style.transform = `translateY(${(Math.sin(t * 2.1 + i * 1.7) * 7).toFixed(1)}px) scale(${(0.7 + 0.3 * a).toFixed(4)})`;
      });
      [["pill1", 9.2], ["pill2", 9.4]].forEach(([id, at]) => {
        const p = RS.seg(t, at, at + 0.45, "back.out(1.4)");
        $(id).style.opacity = RS.seg(t, at, at + 0.15);
        $(id).style.transform = `translateX(${((1 - p) * 260).toFixed(1)}px)`;
      });
      const intro = RS.seg(t, 7.7, 8.15, "power3.out"), out = RS.seg(t, 16.85, 17.3, "power3.in");
      $("car").style.opacity = (intro * (1 - out)).toFixed(3);
      $("car").style.transform = `translateX(${(-out * 260).toFixed(1)}px) scale(${(0.92 + 0.08 * intro).toFixed(4)})`;
    }

    // 4 원본 → 결과, 5 타이틀
    const cmpOn = t >= 16.9 && t < 26.6;
    $("cmp").style.display = cmpOn ? "block" : "none";
    if (cmpOn) {
      const a = RS.seg(t, 17.0, 17.55, "power3.out"), b = RS.seg(t, 17.4, 17.95, "power3.out");
      $("pc-in").style.opacity = RS.seg(t, 17.0, 17.2);
      $("pc-in").style.transform = `translateX(${((1 - a) * -560).toFixed(1)}px)`;
      $("pc-out").style.opacity = RS.seg(t, 17.4, 17.6);
      $("pc-out").style.transform = `translateX(${((1 - b) * 560).toFixed(1)}px) rotate(${((1 - b) * 8).toFixed(2)}deg)`;
      const idx = t < 17.9 ? 0 : Math.floor((t - 17.9) / 0.5) % N;
      for (let i = 0; i < N; i++) $(`po${i}`).style.opacity = i === idx ? 1 : 0;
      $("cmp-head").style.opacity = RS.seg(t, 17.6, 17.9) * (1 - RS.seg(t, 20.8, 21.0));
      $("cmp-head").style.transform = `translateY(${((1 - RS.seg(t, 17.6, 18.0, "power3.out")) * 24).toFixed(1)}px)`;
      const m = RS.seg(t, 21.0, 21.6, "power3.inOut");
      $("cmp").style.transform = `translateY(${(m * 230).toFixed(1)}px) scale(${(1 - 0.12 * m).toFixed(4)})`;
    }
    const titleOn = t >= 21 && t < 26.6;
    for (const id of ["t-logo", "t-title", "t-pills"]) $(id).style.display = titleOn ? "" : "none";
    if (titleOn) {
      $("t-logo").style.opacity = RS.seg(t, 21.3, 21.6);
      rowIn($("t-title").firstElementChild, t, 21.45);
      ctas.forEach((_, i) => {
        const at = 21.95 + i * 0.25, p = RS.seg(t, at, at + 0.45, "back.out(1.5)");
        $(`tp${i}`).style.opacity = RS.seg(t, at, at + 0.15);
        $(`tp${i}`).style.transform = `translateX(${((1 - p) * -220).toFixed(1)}px)`;
      });
    }

    // 1 훅: 영상 위 카피 → 카드로 줄어들며 컬러 칩이 터지고 → 위로 날아간다
    const hookOn = t < 3.65;
    $("hook").style.display = hookOn ? "block" : "none";
    if (hookOn) {
      rowIn($("h1"), t, 0.3, 2.25); rowIn($("h2"), t, 1.15, 2.25);
      const s = RS.seg(t, 2.3, 3.0, "power3.inOut"), up = RS.seg(t, 3.15, 3.6, "power3.in");
      $("hook").style.transform = `translateY(${(-up * 1500).toFixed(1)}px) scale(${(1 - 0.5 * s).toFixed(4)})`;
      $("hook").style.borderRadius = `${(s * 80).toFixed(1)}px`;
    }
    SW.forEach((_, i) => {
      const p = RS.seg(t, 2.85, 3.75, "power3.out"), ang = (i / SW.length) * Math.PI * 2 - Math.PI / 2;
      const r = p * (340 + (i % 3) * 60), el = $(`sw${i}`);
      el.style.opacity = t < 2.85 || t > 3.8 ? 0 : (1 - RS.seg(t, 3.35, 3.75)).toFixed(3);
      el.style.transform = `translate(${(Math.cos(ang) * r).toFixed(1)}px, ${(Math.sin(ang) * r).toFixed(1)}px) scale(${(0.4 + 0.8 * p).toFixed(3)})`;
    });

    // 6 끝
    $("end").style.opacity = RS.seg(t, 26.0, 26.45, "power2.out");
  };

  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["rs-chat-carousel"] = tl;
  RS.sample(tl, 0, DUR, (p) => render(p * DUR));
  render(0);
  RS.ready([...document.querySelectorAll("img")]).then(() => render(tl.time()));
})();
</script>
</body>
</html>
