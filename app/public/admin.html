<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Counter · Staff</title>
<link rel="stylesheet" href="/style.css">
<style>
/* 사장님 화면 — design/inbox 시안 A(채널톡형). 손님 1명 = 대화 1개, 승인·답장은 대화 하단에 고정 */
html:has(body.admin),body.admin{height:100%}
body.admin{background:#fff}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column} /* vh 대신 %: 녹화기 zoom에서도 화면에 맞는다 */
.main{flex:1;overflow-y:auto;position:relative}
.av.s{width:28px;height:28px}.av.txt{background:#ff9364;font-size:15px}.av.s.txt{font-size:12px}
.hd{padding:18px 20px 10px}.hd h1{font-size:26px;margin:0;line-height:1.2}
.seg{display:flex;gap:6px;padding:0 16px 8px}
.seg button{font-size:13.5px;padding:7px 12px;border-radius:999px;background:var(--bg);color:var(--sub);font-weight:600}
.seg button.on{background:var(--ink);color:#fff}
.conv{display:flex;gap:12px;padding:12px 20px;align-items:flex-start;cursor:pointer;width:100%;background:none;text-align:left;font:inherit;color:inherit}
.conv+.conv{border-top:1px solid var(--line)}
.conv:active{background:var(--bg)}
.conv .m{flex:1;min-width:0}
.conv .t{display:flex;justify-content:space-between;gap:8px}
.conv b{font-size:15.5px}
.conv .via{font-size:12.5px;color:var(--mut)}
.conv p{margin:2px 0 0;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.need p{color:var(--ink);font-weight:600}
.conv .time{font-size:12px;color:var(--mut);white-space:nowrap}
.conv.need .time{color:var(--brand);font-weight:600}
.th{display:flex;gap:10px;align-items:center;padding:12px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.th .back{font-size:26px;line-height:1;color:var(--brand);padding:0 6px;background:none}
.th b{display:block;font-size:16px}.th small{font-size:12.5px;color:var(--mut)}
.facts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--sub)}
.msgs{padding:14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:80%;padding:9px 13px;border-radius:18px;font-size:14.5px;animation:pop .3s ease}
.b.in{align-self:flex-start;background:var(--bg);border-bottom-left-radius:6px}
.b.out{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:6px}
.lbl{font-size:11.5px;color:var(--mut);margin-bottom:4px}.lbl.r{align-self:flex-end}
.lbl.wait{color:var(--warn);font-weight:600}
.req{align-self:stretch;border:1px solid var(--line);border-radius:16px;padding:14px;animation:pop .3s ease;margin-bottom:4px}
.req .k{font-size:12.5px;color:var(--mut)}
.req .big{font-size:20px;font-weight:700;margin:2px 0}
.req.done .k{color:var(--ok);font-weight:600}.req.no{opacity:.6}
.dock{flex:none;border-top:1px solid var(--line);padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#fff}
.dock .why{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.dock .two{display:flex;gap:8px}.dock .two .primary{flex:1}
.ghost{background:var(--bg);border:0}
.inp{display:flex;gap:8px;align-items:flex-end}
.inp textarea{flex:1;border-radius:20px;padding:9px 14px;resize:none;min-height:40px}
.send{background:var(--brand);color:#fff;border-radius:50%;width:40px;height:40px;flex:none;font-size:18px;font-weight:700}
.rem{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:9px;color:var(--sub);cursor:pointer}
.rem input{display:none}
.tog{width:34px;height:20px;border-radius:10px;background:#d1d3d8;position:relative;flex:none;transition:background .15s}
.tog:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.rem input:checked+.tog{background:var(--brand)}.rem input:checked+.tog:after{left:16px}
.tabs{position:static;flex:none}
.wrap{padding-bottom:24px}

/* 다듬기: design/polish 시안 1 Clean (11/09 최수민 선택) */
body.admin{--sub:#555d6d;--mut:#868b94;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",sans-serif;letter-spacing:-.01em}
.hd{padding:22px 20px 12px}.hd h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
.seg button{background:none;padding:6px 2px;margin-right:14px;border-radius:0;font-size:15px;color:var(--mut)}
.seg button.on{background:none;color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.conv{padding:14px 20px;gap:14px}.conv+.conv{border-top:0}
.conv .av{width:50px;height:50px}
.conv b{font-size:16.5px;font-weight:600}
.conv p{font-size:14.5px;color:var(--mut)}
.conv.need p{color:var(--ink);font-weight:500}
.conv.need .time{color:var(--brand)}
.conv.need .time:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:6px;vertical-align:1px}
.th{border-bottom:0;padding:14px 14px 6px}.th b{font-size:17px}
.facts{border-bottom:1px solid var(--line);padding:6px 16px 14px}
.chip{background:none;border:1px solid var(--line);color:var(--sub)}
.b{font-size:15px;border-radius:20px;padding:10px 14px}
.b.in{background:var(--bg)}.b.out{background:var(--brand)}
.req{border:0;background:var(--bg);border-radius:22px;padding:18px}
.req .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.req .big{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px}
.req .sub{color:var(--sub)}
.req.done{background:var(--ok-50)}.req.done .big{color:var(--ink)}
.dock{border-top:0;padding-top:6px}
.dock .why{text-align:center}
.dock .two{flex-direction:row-reverse}
.dock .primary{height:54px;border-radius:16px;font-size:17px}
.dock .ghost{background:none;color:var(--sub);font-weight:600;padding:0 18px}
.inp textarea{background:var(--bg);border:0}
.tabs{border-top:1px solid var(--line)}.tabs button.on{color:var(--ink)}
/* 탭바: 아이콘 + 글자 */
.tabs{padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11.5px;font-weight:600;color:var(--mut)}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on svg{stroke-width:2.2}
.tabs .ic{position:relative;display:block;line-height:0}
.tabs .badge{position:absolute;top:-4px;left:16px;margin:0}
/* Counter가 사장님 없이 끝낸 대화 = 초록. 목록 행·말풍선·라벨이 같은 초록(당근 green)으로 "알아서 끝났다"를 보여 준다 */
.conv.auto{background:var(--ok-50)}
.avw{position:relative;flex:none;line-height:0}
.conv.auto .avw:after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--ok-500);color:#fff;font-size:12px;font-weight:800;line-height:20px;text-align:center;box-shadow:0 0 0 2px #fff}
.conv.auto p{color:var(--ok);font-weight:600}
.conv.auto .time{color:var(--ok)}
.b.out.auto{background:var(--ok-500)}
.lbl.auto{color:var(--ok);font-weight:600}
.conv{will-change:transform}
</style>
</head>
<body class="admin">
<div class="app">
  <main class="main" id="view"></main>
  <div id="dock"></div>
  <nav class="tabs">
    <button data-tab="inbox" class="on"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span id="badge" class="badge" hidden></span></span>Inbox</button>
    <button data-tab="memory"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></span>Memory</button>
    <button data-tab="settings"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5 4.6 4h14.8L21 9.5"/><path d="M3 9.5h18v.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 12.5V20h14v-7.5"/><path d="M10 20v-4.5h4V20"/></svg></span>Store info</button>
  </nav>
</div>

<script>
let S = null, tab = 'inbox', filter = 'all', openKey = null, drafts = {}, editing = false, sig = '';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = (iso) => { const s = Math.round((Date.now() - new Date(iso)) / 1000); return s < 60 ? 'now' : s < 3600 ? `${Math.floor(s / 60)}m` : new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); };
const day = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
const post = (u, b) => fetch(u, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b || {}) }).then((r) => r.json());
const AV = { muse: 'muse', pickle: 'pickle', dots: 'dots', grok: 'grok-bot' };
const avatar = (agent, cls = '') => { const k = Object.keys(AV).find((x) => new RegExp(x, 'i').test(agent || '')); return k ? `<img class="av ${cls}" src="/agents/${AV[k]}.png" alt="">` : `<span class="av txt ${cls}">${esc((agent || '?')[0])}</span>`; };
// 'GB' → 🇬🇧 GB, 'Japan' → Japan
const nat = (n) => /^[A-Za-z]{2}$/.test(n || '') ? String.fromCodePoint(...[...n.toUpperCase()].map((c) => 0x1f1a5 + c.charCodeAt(0))) + ' ' + n.toUpperCase() : n;
const pending = (t) => t.status === 'input-required';
// Counter가 사장님 손 없이 끝낸 건: 기억으로 바로 답한 질문
const auto = (t) => t.status === 'completed' && t.source === 'memory';

// 손님 1명(에이전트 + 손님 이름) = 대화 1개
function conversations() {
  const m = new Map();
  for (const t of [...S.tasks].reverse()) { // 서버가 최신순으로 주므로 뒤집으면 들어온 순서(같은 ms여도 정확)
    const key = `${t.agent}|${t.onBehalfOf}`;
    if (!m.has(key)) m.set(key, { key, agent: t.agent, guest: t.onBehalfOf || 'Guest', tasks: [] });
    m.get(key).tasks.push(t);
  }
  return [...m.values()].map((c) => {
    const last = c.tasks[c.tasks.length - 1], booking = [...c.tasks].reverse().find((t) => t.type === 'booking');
    return { ...c, last, booking, need: c.tasks.some(pending), auto: c.tasks.every(auto), at: last.resolvedAt || last.createdAt };
  }).sort((a, b) => (b.need - a.need) || b.at.localeCompare(a.at));
}

function preview(t) {
  if (t.type === 'booking') {
    const when = `${t.serviceName}, ${day(t.date)} ${t.time}`;
    return pending(t) ? `Booking: ${when} — approve?` : t.status === 'completed' ? `Booked · ${when}` : `Declined · ${when}`;
  }
  return pending(t) ? `“${t.question}”` : t.source === 'memory' ? `✓ Answered from memory: ${t.answer}` : `You: ${t.answer}`;
}

function listView() {
  const all = conversations(), need = all.filter((c) => c.need), shown = filter === 'need' ? need : all;
  return `<div data-screen="list"><div class="hd"><h1>${esc(S.store.name)}</h1></div>
    <div class="seg"><button class="${filter === 'need' ? 'on' : ''}" onclick="filter='need';render()">Needs you · ${need.length}</button><button class="${filter === 'all' ? 'on' : ''}" onclick="filter='all';render()">All · ${all.length}</button></div>
    ${shown.map((c) => {
      const p = c.booking?.patient || {};
      return `<button class="conv ${c.need ? 'need' : c.auto ? 'auto' : ''}" data-conv="${esc(c.key)}" onclick="openConv(this.dataset.conv)"><span class="avw">${avatar(c.agent)}</span><div class="m">
        <div class="t"><b>${esc(c.guest)}</b><span class="time">${ago(c.at)}</span></div>
        <div class="via">via ${esc(c.agent)}${p.nationality ? ' · ' + esc(nat(p.nationality)) : ''}</div>
        <p>${esc(preview(c.tasks.find(pending) || c.last))}</p></div></button>`;
    }).join('')}
    ${!shown.length ? `<p class="empty">${all.length ? 'Nothing needs you right now.' : `No agent requests yet.<br>Share your Counter link: <code>/s/${S.store.slug}</code>`}</p>` : ''}</div>`;
}

function threadItem(t, c) {
  if (t.type === 'booking') {
    const k = pending(t) ? `Booking request · slot held for ${esc(t.agent)}` : t.status === 'completed' ? `✓ Booked · ${esc(t.confirmation)}` : 'Declined';
    return `<div class="req ${t.status === 'completed' ? 'done' : t.status === 'rejected' ? 'no' : ''}"><div class="k">${k}</div><div class="big">${day(t.date)} · ${esc(t.time)}</div><div class="sub">${esc(t.serviceName)} · ${esc(t.price)}</div></div>`;
  }
  const saved = S.memory.some((m) => m.question === t.question);
  return `<div class="b in">${esc(t.question)}</div>` + (pending(t)
    ? `<div class="lbl wait">Not in your store info · ${esc(t.agent)} is waiting</div>`
    : `<div class="b out ${auto(t) ? 'auto' : ''}">${esc(t.answer)}</div><div class="lbl r ${auto(t) ? 'auto' : ''}">${auto(t) ? '✓ Counter answered from memory · instantly' : `You answered in ${t.seconds}s${saved ? ' · saved to memory' : ''}`}</div>`);
}

function threadView(c) {
  const p = c.booking?.patient || {}, facts = [p.nationality && nat(p.nationality), ...(c.booking?.notes || '').split(/\.\s*/).filter(Boolean)].filter(Boolean);
  return `<div data-screen="thread"><div class="th"><button class="back" data-act="back" onclick="openKey=null;render()">‹</button>${avatar(c.agent, 's')}<div><b>${esc(c.guest)}</b><small>via ${esc(c.agent)}${p.phone ? ' · ' + esc(p.phone) : ''}</small></div></div>
    ${facts.length ? `<div class="facts">${facts.map((f) => `<span class="chip">${/wheelchair/i.test(f) ? '♿ ' : ''}${esc(f)}</span>`).join('')}</div>` : ''}
    <div class="msgs">${c.tasks.map((t) => threadItem(t, c)).join('')}</div></div>`;
}

// 대화 하단: 가장 먼저 들어온 대기 건 하나 — 예약이면 승인, 질문이면 답장
function dockView(c) {
  const t = c?.tasks.find(pending);
  if (!t) return '';
  if (t.type === 'booking') return `<div class="dock"><div class="why">Nothing is booked until you approve.</div><div class="two"><button class="ghost" data-act="decline" onclick="act('${t.id}','reject')">Decline</button><button class="primary" data-act="approve" onclick="act('${t.id}','approve')">Approve</button></div></div>`;
  return `<div class="dock"><div class="inp"><textarea id="reply" data-task="${t.id}" rows="1" placeholder="Reply to ${esc(t.agent)}…" oninput="drafts['${t.id}']=this.value">${esc(drafts[t.id] || '')}</textarea><button class="send" data-act="send" onclick="answer('${t.id}')">↑</button></div>
    <label class="rem"><input type="checkbox" id="remember" checked><span class="tog"></span>Remember for next time</label></div>`;
}

function render() {
  if (!S) return;
  const need = conversations().filter((c) => c.need).length;
  $('#badge').hidden = !need; $('#badge').textContent = need;
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  let html, dock = '';
  if (tab === 'inbox') {
    const c = openKey && conversations().find((x) => x.key === openKey);
    if (openKey && !c) openKey = null;
    html = c ? threadView(c) : listView();
    dock = c ? dockView(c) : '';
  } else if (tab === 'memory') {
    html = `<div class="wrap"><p class="lead">What Counter tells agents, besides your store info. Anything you answer with “Remember” lands here.</p>
      ${S.memory.length ? S.memory.map((m, i) => `<article class="card mem"><small class="muted">Learned ${ago(m.learnedAt)}</small><p class="question">“${esc(m.question)}”</p><p class="answer">${esc(m.answer)}</p><button class="link" onclick="forget(${i})">Forget</button></article>`).join('') : '<p class="empty">Nothing learned yet.</p>'}</div>`;
  } else {
    if (editing) return;
    const f = [['hours', 'Opening hours'], ['holidays', 'Public holidays'], ['accessibility', 'Accessibility'], ['languages', 'Languages'], ['payment', 'Payment'], ['medical', 'Medical questions policy']];
    html = `<div class="wrap"><p class="lead">Agents read this at <code>/s/${S.store.slug}</code>. Changes go live instantly.</p>
      <article class="card"><h3>Services</h3><ul class="svc">${S.services.map((s) => `<li><b>${esc(s.name)}</b><span>${esc(s.price)} · ${esc(s.duration)}</span></li>`).join('')}</ul></article>
      <article class="card settings">${f.map(([k, l]) => `<label>${l}<textarea data-k="${k}" rows="2" onfocus="editing=true">${esc(S.settings[k])}</textarea></label>`).join('')}
      <div class="row"><button class="primary" onclick="saveSettings()">Save</button></div></article>
      <article class="card"><h3>Approval rules</h3><p class="muted">Bookings, cancellations and payments always need staff approval. Medical questions always go to staff.</p></article>
      <p class="center"><button class="link" onclick="resetDemo()">Reset demo data</button></p></div>`;
  }
  // 바뀐 게 없으면 DOM을 건드리지 않는다(스크롤·애니메이션 유지)
  if (html + dock === sig) return;
  sig = html + dock;
  $('#view').innerHTML = html;
  $('#dock').innerHTML = dock;
  $('#view').scrollTop = openKey ? $('#view').scrollHeight : 0;
  springNew();
}

// 새 inbox(새 대화, 또는 기존 대화에 새로 들어온 요청)가 생기면 그 행만 스프링으로 튀어 들어온다.
// 마지막 요청 id를 기억해 두고 바뀐 행만 고른다. 첫 로딩에 있던 행은 움직이지 않는다.
let seen = null;
const SPRING = (() => { // 감쇠 스프링(ζ=0.45)을 키프레임으로 펼친다 — 아래로 떨어지며 살짝 넘쳤다 제자리
  const z = 0.45, w = 2 * Math.PI / 0.42, wd = w * Math.sqrt(1 - z * z), N = 40, T = 0.9;
  return Array.from({ length: N + 1 }, (_, i) => {
    const t = (i / N) * T, x = 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
    return { offset: i / N, transform: `translateY(${((1 - x) * -36).toFixed(2)}px) scale(${(0.86 + 0.14 * x).toFixed(4)})`, opacity: Math.min(1, i / (N * 0.15)) };
  });
})();
function springNew() {
  if (tab !== 'inbox' || !S) return;
  const now = new Map(conversations().map((c) => [c.key, c.last.id]));
  if (seen) document.querySelectorAll('[data-conv]').forEach((el) => {
    if (seen.get(el.dataset.conv) !== now.get(el.dataset.conv)) el.animate(SPRING, { duration: 900, easing: 'linear' });
  });
  seen = now;
}

function openConv(key) { openKey = key; render(); }
async function load() { try { S = await (await fetch('/admin/api/state')).json(); render(); } catch {} }
async function act(id, a) { await post(`/admin/api/tasks/${id}/${a}`); load(); }
async function answer(id) { const v = ($('#reply')?.value || '').trim(); if (!v) return; await post(`/admin/api/tasks/${id}/answer`, { answer: v, remember: $('#remember').checked }); delete drafts[id]; load(); }
async function forget(i) { await post('/admin/api/memory/delete', { index: i }); load(); }
async function saveSettings() { const b = {}; document.querySelectorAll('[data-k]').forEach((t) => (b[t.dataset.k] = t.value)); await post('/admin/api/settings', b); editing = false; load(); }
async function resetDemo() { if (confirm('Reset all demo data?')) { await post('/admin/api/reset'); openKey = null; load(); } }
document.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; editing = false; openKey = null; sig = ''; render(); }));
// 답을 입력하는 동안에는 다시 그리지 않는다
setInterval(() => { if (!document.activeElement?.matches('textarea')) load(); }, 1000);
load();
</script>
</body>
</html>
