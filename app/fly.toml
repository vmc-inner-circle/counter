# fly deploy (run inside app/). State lives on the volume (/data/state.json); seed is copied on first boot.
# Secrets: fly secrets set ADMIN_TOKEN=...
app = "counter-agent"
primary_region = "nrt"

[build]

[mounts]
  source = "counter_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # 승인 대기 중인 요청을 메모리에 들고 있으므로 1대를 계속 켜 둔다
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
